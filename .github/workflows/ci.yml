name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        emacs_version:
          - 29.1
          - 30.1
          - snapshot
    steps:
      - uses: actions/checkout@v6
      - uses: purcell/setup-emacs@v8.0
        with:
          version: ${{ matrix.emacs_version }}
      - name: Byte compile
        run: make compile
      - name: Run tests
        run: make test
      - name: Lint
        run: make lint
      - name: Package lint
        run: make package-lint
